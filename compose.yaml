x-application: &application
  build: .
  environment:
    DATABASE_URL: postgresql://wager:wager@postgres:5432/wager
    SQS_ENDPOINT: http://localstack:4566
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.7-alpine
    command: ["postgres", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  localstack:
    build:
      context: ./docker
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-events"]
      interval: 3s
      timeout: 5s
      retries: 30
  migrate:
    build: .
    command: ["bun", "dist/database.js", "up"]
    environment:
      DATABASE_URL: postgresql://wager:wager@postgres:5432/wager
    depends_on:
      postgres:
        condition: service_healthy
  app:
    <<: *application
    ports: ["3000:3000"]
    stop_grace_period: 75s
  app2:
    <<: *application
    profiles: ["cluster"]
    ports: ["3001:3000"]
    stop_grace_period: 75s
  app3:
    <<: *application
    profiles: ["cluster"]
    ports: ["3002:3000"]
    stop_grace_period: 75s

volumes:
  pgdata:
