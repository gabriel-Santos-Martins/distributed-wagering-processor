name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose, Keycloak and test suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://wager:wager@localhost:5432/wager
      SQS_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      # The whole stack exactly as the README starts it: PostgreSQL, LocalStack, Keycloak, migrations
      # and three application instances.
      - name: Start the stack with Docker Compose
        # No --wait: the one-shot migrate service exits by design; readiness is checked below.
        run: docker compose --profile cluster up --build -d

      - name: Three instances are ready
        run: |
          for port in 3000 3001 3002; do
            for attempt in $(seq 1 150); do
              if curl -fsS "http://localhost:$port/health/ready"; then echo " <- $port"; break; fi
              if [ "$attempt" = 150 ]; then echo "instance on $port is not ready"; docker compose ps -a; exit 1; fi
              sleep 2
            done
          done
          docker compose ps -a

      - name: Authentication against the Keycloak container
        run: bun run test:keycloak
        env:
          KEYCLOAK_REALM_URL: http://localhost:8080/realms/wagering
          API_URL: http://127.0.0.1:3000

      - name: Requests through each instance share one database
        run: |
          token() {
            curl -fsS -X POST http://localhost:8080/realms/wagering/protocol/openid-connect/token \
              -d grant_type=client_credentials -d client_id="$1" -d client_secret="$2" | jq -r .access_token
          }
          OPERATOR=$(token back-office back-office-local-secret)
          PROVIDER=$(token provider-a provider-a-local-secret)
          PLAYER=$(cat /proc/sys/kernel/random/uuid)
          WALLET=$(curl -fsS -X POST http://localhost:3000/wallets -H "Authorization: Bearer $OPERATOR" \
            -H 'Content-Type: application/json' \
            -d "{\"playerId\":\"$PLAYER\",\"initialBalance\":{\"amount\":\"100.00\",\"currency\":\"BRL\"}}" | jq -r .id)
          for port in 3000 3001 3002; do
            curl -fsS -X POST "http://localhost:$port/wagering/transactions" -H "Authorization: Bearer $PROVIDER" \
              -H 'Content-Type: application/json' -H "Idempotency-Key: provider-a:ci-bet-$port" \
              -d "{\"providerId\":\"provider-a\",\"externalTransactionId\":\"ci-bet-$port\",\"playerId\":\"$PLAYER\",\"walletId\":\"$WALLET\",\"roundId\":\"ci\",\"gameId\":\"ci\",\"kind\":\"BET\",\"money\":{\"amount\":\"10.00\",\"currency\":\"BRL\"}}"
            echo
          done
          RESULT=$(curl -fsS -X POST "http://localhost:3002/wallets/$WALLET/reconciliation" -H "Authorization: Bearer $OPERATOR")
          echo "$RESULT"
          echo "$RESULT" | jq -e '.consistent == true and .storedBalance.amount == "70.00"'

      # The suites own the queues and migrate the database down and up, so the applications stop first,
      # as the README describes. PostgreSQL and LocalStack keep running.
      - name: Stop the application instances
        run: docker compose --profile cluster stop app app2 app3

      - name: Build
        run: bun run build

      - name: Integration tests (real PostgreSQL)
        run: bun run test:integration

      - name: Authentication tests (local JWKS and the compiled API)
        run: bun run test:auth

      - name: Concurrency and messaging tests (three processes, real LocalStack)
        run: bun run test:concurrency

      - name: Container logs
        if: failure()
        run: docker compose --profile cluster logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose --profile cluster down -v
